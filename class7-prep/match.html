<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 7 Prep Matching Game</title>
<style>
  :root { --bg:#ffffff; --text:#1f2933; --muted:#52606d; --card:#f5f7fa; --line:#d9e2ec;
          --accent:#157878; --good:#1b7f3b; --bad:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141a1f; --text:#e4e9ee; --muted:#a3b0bd; --card:#1d252c; --line:#34414d;
            --accent:#4fc3c3; --good:#6fd08c; --bad:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  nav a { color:var(--accent); }
  h1 { margin:.6em 0 .2em; font-size:1.7rem; }
  .note { color:var(--muted); margin:0 0 1em; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0; }
  select, button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button:focus-visible, select:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #board { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .tile { min-height:64px; padding:10px; text-align:center; font-size:1rem; border:2px solid var(--line); border-radius:12px; background:var(--card); }
  .tile.sel { border-color:var(--accent); background:rgba(21,120,120,.15); }
  .tile.ok { border-color:var(--good); color:var(--good); background:transparent; opacity:.65; cursor:default; }
  .tile.no { border-color:var(--bad); animation:shake .3s; }
  @keyframes shake { 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  @media (prefers-reduced-motion: reduce) { .tile.no { animation:none; } }
  #stats { font-weight:600; }
  #summary { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:16px 0; font-weight:600; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <nav><a href="./">← Class 7 prep home</a> · <a id="backlink" href="./">Subject page</a></nav>
  <h1 id="title">Matching game</h1>
  <p class="note">Tap a left tile, then the right tile that goes with it. Match all six to win. Wrong taps are counted, so go for fewer.</p>

  <div class="controls">
    <label for="group">Set:</label>
    <select id="group"></select>
    <button class="primary" id="start" type="button">New game</button>
  </div>
  <p id="stats" role="status"></p>
  <div id="board" class="hidden"></div>
  <div id="summary" class="hidden" role="status"></div>
</main>

<script src="assets/prep.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var deckName = (params.get("deck") || "mathematics").toLowerCase().replace(/[^a-z-]/g, "");
  var $ = function (id) { return document.getElementById(id); };
  var cards = [], PAIRS = 6;
  var left = null, matched = 0, wrong = 0, round = [];

  function addText(parent, text) {
    text.split(/(\^\{[^}]*\}|\^\d+)/).forEach(function (part) {
      if (/^\^\{[^}]*\}$/.test(part) || /^\^\d+$/.test(part)) {
        var sup = document.createElement("sup");
        sup.textContent = part.charAt(1) === "{" ? part.slice(2, -1) : part.slice(1);
        parent.appendChild(sup);
      } else if (part) { parent.appendChild(document.createTextNode(part)); }
    });
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function tile(text, side, pair) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "tile"; b.dataset.side = side; b.dataset.pair = pair;
    addText(b, text);
    b.addEventListener("click", function () { tap(b); });
    return b;
  }
  function clearSel() { var s = document.querySelector(".tile.sel"); if (s) { s.classList.remove("sel"); } }
  function stats() { $("stats").textContent = "Matched " + matched + " of " + PAIRS + " · Wrong taps: " + wrong; }

  function tap(b) {
    if (b.classList.contains("ok")) { return; }
    if (b.dataset.side === "l") { clearSel(); left = b; b.classList.add("sel"); return; }
    if (!left) { return; }
    // the right tile is correct if its text equals the chosen card's answer
    var good = left.dataset.pair === b.dataset.pair || round[+left.dataset.pair].b === round[+b.dataset.pair].b;
    if (good) {
      left.classList.remove("sel"); left.classList.add("ok"); b.classList.add("ok");
      left = null; matched++; stats();
      if (matched === PAIRS) { win(); }
    } else {
      wrong++; stats();
      b.classList.add("no");
      setTimeout(function () { b.classList.remove("no"); }, 350);
    }
  }
  function win() {
    var s = $("summary");
    s.classList.remove("hidden");
    s.textContent = wrong === 0 ? "Perfect, no wrong taps! Try another set." :
      "All matched with " + wrong + " wrong " + (wrong === 1 ? "tap" : "taps") + ". Play again and try for fewer.";
    if (window.C7) { C7.markActive(); }
  }
  function start() {
    var v = $("group").value;
    var pool = cards.filter(function (c) { return (v === "all" || String(c.g) === v) && c.f.length <= 60 && c.b.length <= 60; });
    // avoid two cards with the same answer in one round
    var seen = {}, picked = [];
    shuffle(pool).forEach(function (c) {
      if (picked.length < PAIRS && !seen[c.b]) { seen[c.b] = 1; picked.push(c); }
    });
    round = picked;
    PAIRS = Math.min(6, round.length);
    matched = 0; wrong = 0; left = null;
    $("summary").classList.add("hidden");
    var L = document.createElement("div"), R = document.createElement("div");
    L.className = R.className = "col";
    shuffle(round.map(function (c, i) { return i; })).forEach(function (i) { L.appendChild(tile(round[i].f, "l", i)); });
    shuffle(round.map(function (c, i) { return i; })).forEach(function (i) { R.appendChild(tile(round[i].b, "r", i)); });
    var board = $("board");
    board.textContent = ""; board.appendChild(L); board.appendChild(R);
    board.classList.remove("hidden");
    stats();
  }

  fetch("data/cards-" + deckName + ".json")
    .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); })
    .then(function (d) {
      $("title").textContent = d.title.replace("flashcards", "matching game");
      document.title = $("title").textContent + " | Class 7 Prep";
      if (d.back) { $("backlink").href = d.back; }
      var sel = $("group");
      var all = document.createElement("option");
      all.value = "all"; all.textContent = "All sets"; sel.appendChild(all);
      d.groups.forEach(function (g, gi) {
        var o = document.createElement("option");
        o.value = String(gi); o.textContent = g.name; sel.appendChild(o);
        g.cards.forEach(function (c) { cards.push({ g: gi, f: c[0], b: c[1] }); });
      });
      $("stats").textContent = "Pick a set and press New game.";
    })
    .catch(function () {
      $("stats").textContent = "The game couldn't load. If you opened this file straight from your computer, open it from the website instead.";
      $("start").disabled = true;
    });
  $("start").addEventListener("click", start);
})();
</script>
</body>
</html>
